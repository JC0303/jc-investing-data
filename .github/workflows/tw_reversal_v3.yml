name: TW short-term v3 (attempt 2) backtest

on:
  push:
    branches: [main]
    paths: [.github/workflows/tw_reversal_v3.yml]   # runs once when this file lands
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy yfinance
      - name: Run backtest
        run: python scripts/tw_reversal_v3_backtest.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "jc-investing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A results || true
          git diff --cached --quiet || git commit -m "TW v3 (attempt 2) backtest $(date -u +%F)"
          git pull --rebase && git push
