name: SEC quarterly revenue

on:
  schedule:
    - cron: "17 21 * * 0"   # every Sunday 21:17 UTC = Monday 05:17 Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch SEC frames
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python scripts/sec_revenue.py
      - name: Commit data
        run: |
          git config user.name "jc-investing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec_revenue.csv
          git diff --cached --quiet || git commit -m "SEC revenue update $(date -u +%F)"
          git push
