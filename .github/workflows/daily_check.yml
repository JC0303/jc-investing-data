name: Daily position check

# Deterministic and free: no model, no network, no orders. Reads the holdings,
# the approved rules and the TWSE close this repo already fetches, and writes
# results/daily_check.json and results/daily_check.md for the reporting agent.
# Runs when the TW fetch actually finishes, not at a guessed time. The fetch is
# scheduled for 18:05 Taipei but has been landing at 02:25-04:06 the next
# morning, every day, so a clock-based check read day-old data every time.
on:
  workflow_run:
    workflows: ["TW market data (DATA-03)"]
    types: [completed]
  # Heartbeat: without it the check has no trigger of its own, so if the fetch
  # workflow ever stops firing the check simply never runs and nothing says so.
  schedule:
    - cron: "23 22 * * 1-5"   # 06:23 Taipei
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-position-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A failed or cancelled fetch leaves the previous day's data in the
      # checkout, so the check must know its inputs may be stale rather than
      # produce a confident report on yesterday's close.
      - name: Note a fetch that did not succeed
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success'
        shell: bash
        run: echo "UPSTREAM_FETCH_CONCLUSION=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_ENV"

      # pipefail matters here: without it the step's status is tee's, so a
      # Python crash looked like a successful run.
      - name: Run the check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/daily_check.py | tee check_output.txt

      - name: Tests
        if: always()
        shell: bash
        run: |
          python -m pip install --quiet pytest pandas numpy
          python -m pytest tests/ -q

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## 每日部位檢查" >> "$GITHUB_STEP_SUMMARY"
          cat check_output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Commit the result
        if: always()
        shell: bash
        run: |
          rm -f check_output.txt
          git config user.name "daily-check-bot"
          git config user.email "daily-check-bot@users.noreply.github.com"
          git add results/daily_check.json results/daily_check.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "daily check $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
